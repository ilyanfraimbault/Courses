name: deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  # Un déploiement en cours ne s'annule pas : on ne veut pas d'une bascule
  # interrompue au milieu.
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Un secret manquant doit faire échouer le déploiement ici, bruyamment,
      # et non plus loin sous la forme d'un saut vert. COURSES_ENV_FILE mérite
      # une mention particulière : l'action Hostinger réécrit le .env du projet
      # à chaque exécution, donc un secret vide effacerait la configuration du
      # site en production.
      - name: Vérifier que la configuration est complète
        env:
          HOSTINGER_API_KEY: ${{ secrets.HOSTINGER_API_KEY }}
          COURSES_ENV_FILE: ${{ secrets.COURSES_ENV_FILE }}
          HOSTINGER_VM_ID: ${{ vars.HOSTINGER_VM_ID }}
        run: |
          manquants=()
          [ -n "$HOSTINGER_API_KEY" ] || manquants+=("secrets.HOSTINGER_API_KEY")
          [ -n "$COURSES_ENV_FILE" ]  || manquants+=("secrets.COURSES_ENV_FILE")
          [ -n "$HOSTINGER_VM_ID" ]   || manquants+=("vars.HOSTINGER_VM_ID")
          if [ ${#manquants[@]} -gt 0 ]; then
            for m in "${manquants[@]}"; do echo "::error::$m n'est pas défini"; done
            exit 1
          fi
          echo "Configuration complète."

  publier:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # Le cache est partagé avec le job « image » de la CI : sur une
          # fusion, l'essentiel est déjà construit.
          cache-from: type=gha,scope=courses
          cache-to: type=gha,mode=max,scope=courses
          tags: |
            ghcr.io/${{ github.repository_owner }}/courses:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/courses:latest

  deployer:
    needs: publier
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      # On envoie le **contenu** du compose, pas un lien vers lui.
      #
      # `hostinger/deploy-on-vps` transmet une URL github.com/…/blob/<sha>/… que
      # l'API Hostinger va chercher elle-même, anonymement. Ce dépôt est privé :
      # cette URL ne rend pas le fichier, elle rend une page de connexion. Une
      # clé de déploiement sur le VPS n'y changerait rien, puisque ce n'est pas
      # le VPS qui télécharge. Le champ `content` de l'API accepte aussi le YAML
      # brut — c'est ce qu'on lui donne, depuis la copie déjà extraite ici.
      - name: Déployer sur le VPS
        env:
          HOSTINGER_API_KEY: ${{ secrets.HOSTINGER_API_KEY }}
          VM_ID: ${{ vars.HOSTINGER_VM_ID }}
          ENV_FILE: ${{ secrets.COURSES_ENV_FILE }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          environnement="$(printf '%s\nIMAGE_TAG=%s\n' "$ENV_FILE" "$IMAGE_TAG")"

          corps="$(jq -n \
            --arg project_name 'courses' \
            --rawfile content compose.yaml \
            --arg environment "$environnement" \
            '{project_name: $project_name, content: $content, environment: $environment}')"

          reponse="$(curl -sS --max-time 60 -w '\n%{http_code}' -X POST \
            -H "Authorization: Bearer ${HOSTINGER_API_KEY}" \
            -H 'Content-Type: application/json' \
            -d "$corps" \
            "https://developers.hostinger.com/api/vps/v1/virtual-machines/${VM_ID}/docker")"

          statut="$(printf '%s' "$reponse" | tail -n1)"
          contenu="$(printf '%s' "$reponse" | sed '$d')"

          if [ "$statut" -lt 200 ] || [ "$statut" -ge 300 ]; then
            echo "::error::l'API Hostinger a répondu ${statut}"
            printf '%s\n' "$contenu"
            exit 1
          fi
          echo "Déploiement accepté par l'API (${statut}). Reste à vérifier qu'il a pris."

      # L'action ci-dessus rend la main dès que l'API a *accepté* la requête,
      # avant que Docker Manager ait touché à l'hôte. Sans cette vérification,
      # un déploiement peut être vert alors que le serveur tourne encore sur
      # l'image précédente. Le tag immuable (le SHA) est ce qui rend le contrôle
      # possible : redéployer un tag mutable inchangé ne recrée rien.
      - name: Vérifier que le VPS tourne bien la nouvelle image
        env:
          HOSTINGER_API_KEY: ${{ secrets.HOSTINGER_API_KEY }}
          VM_ID: ${{ vars.HOSTINGER_VM_ID }}
          PROJECT_NAME: courses
          COMPOSE_FILE: compose.yaml
          EXPECTED_TAG: ${{ github.sha }}
          TIMEOUT_SECONDS: "600"
          POLL_SECONDS: "15"
        run: .github/scripts/verify-rollout.sh
