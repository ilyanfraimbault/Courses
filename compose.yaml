services:
  app:
    image: ghcr.io/ilyanfraimbault/courses:${IMAGE_TAG:-latest}
    # Sans cela, un redéploiement manuel — qui n'a pas d'IMAGE_TAG et retombe
    # donc sur « latest » — réutiliserait en silence l'image déjà présente.
    pull_policy: always
    container_name: courses-app
    restart: unless-stopped
    environment:
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000
      NUXT_BASE_FICHIER: /data/cours.sqlite
      NUXT_SESSION_PASSWORD: "${NUXT_SESSION_PASSWORD:?32 caractères minimum}"
      # Vide, les inscriptions sont fermées : c'est volontairement le défaut.
      NUXT_CODE_INSCRIPTION: "${NUXT_CODE_INSCRIPTION:-}"
      # Vide, personne n'administre.
      NUXT_ADMINISTRATEURS: "${NUXT_ADMINISTRATEURS:-}"
      NUXT_SESSION_COOKIE_SECURE: "true"
      # Caddy réécrit X-Forwarded-For : on peut s'y fier pour identifier la
      # source d'une tentative de connexion.
      NUXT_TRUST_PROXY: "true"
    volumes:
      - courses_data:/data
    # Aucun port publié : Caddy est la seule porte d'entrée.
    networks:
      - courses_internal

  caddy:
    image: caddy:2-alpine
    container_name: courses-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      COURS_ADRESSE: "${COURS_ADRESSE:?le nom d'hôte servi, par exemple cours.exemple.fr}"
      ACME_EMAIL: "${ACME_EMAIL:-}"
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      # À conserver impérativement : sans ce volume, Caddy redemande un
      # certificat à chaque démarrage et se fait limiter par Let's Encrypt.
      - courses_caddy_data:/data
      - courses_caddy_config:/config
    # Le port 3002 de l'hôte, où l'admin de la préprod TrueMain écoute : voir
    # le second bloc du Caddyfile.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - courses_internal

# Le Caddyfile voyage avec le compose plutôt que d'être monté depuis l'hôte :
# ça supprime toute une classe de pannes « le fichier n'est pas là où il faut
# sur le serveur ». Caddy substitue les variables de son environnement au
# chargement, donc changer de domaine ne demande aucune reconstruction d'image.
#
# Les « $$ » ne sont pas une coquille. Ce bloc traverse **deux** interpolations :
# celle de Compose, puis celle de Caddy. Écrit « {$COURS_ADRESSE} », Compose
# reconnaît « $COURS_ADRESSE » et le remplace en laissant les accolades, ce qui
# donne à Caddy l'adresse littérale « {srv1355415.hstgr.cloud} » — qui ne
# qualifie pour aucun certificat, et Caddy redémarre en boucle. « $$ » dit à
# Compose de ne pas y toucher et de rendre un « $ » simple, que Caddy substitue
# à son tour.
configs:
  caddyfile:
    content: |
      {
        email {$$ACME_EMAIL}
      }

      {$$COURS_ADRESSE} {
        log
        encode zstd gzip
        reverse_proxy app:3000
      }

      # Les journaux de la préprod TrueMain, pour la routine cloud qui les lit
      # chaque jour : son proxy de sortie ne laisse passer que le 443, que ce
      # Caddy occupe, et l'admin de la préprod n'écoute que sur le 3002. Seules
      # la connexion et les deux lectures passent ; tout le reste répond 404.
      preprod-admin.truemain.lol {
        @connexion {
          method POST
          path /api/auth/login
        }
        @journaux {
          method GET
          path /api/ops/logs /api/ops/crashes
        }
        handle @connexion {
          reverse_proxy host.docker.internal:3002
        }
        handle @journaux {
          reverse_proxy host.docker.internal:3002
        }
        handle {
          respond 404
        }
      }

volumes:
  courses_data:
  courses_caddy_data:
  courses_caddy_config:

networks:
  courses_internal:
    driver: bridge
